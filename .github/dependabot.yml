# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
# Translated from renovate.json (config:recommended, pin, grouped minors, ignore workspace pkgs).
# Not portable: automerge, dependencyDashboardApproval, biome.json $schema custom manager, OpenSSF PR body.

version: 2

updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 3
      semver-major-days: 3
    ignore:
      - dependency-name: "@packages/*"
      - dependency-name: "@apps/*"
      - dependency-name: "@tools/*"
    groups:
      bun-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      react-major:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - major
      typescript-major:
        applies-to: version-updates
        patterns:
          - "typescript"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore"
