name: Check

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

jobs:
  get-affected:
    name: 🔍 Get affected
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha || 'HEAD' }}
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before || 'HEAD~1' }}
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}
    outputs:
      affected-services: ${{ steps.affected-services.outputs.affected-services }}
      service-ports: ${{ steps.service-ports.outputs.service-ports }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          no-cache: true
          bun-version: 1.4.0

      - name: 🗃️ Cache Bun dependencies
        uses: actions/cache@v5.1.0
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: 📦 Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install

      - name: 🔍 - Get affected services
        id: affected-services
        run: |
          echo "::group::🔍 Getting affected services"
          bun run ci attach-affected --mode docker --output-id affected-services
          echo "::endgroup::"

      - name: 🔍 - Attach service ports to github output
        if: steps.affected-services.outputs.affected-services != ''
        id: service-ports
        run: |
          echo "::group::🔍 Getting service ports"
          bun run ci attach-service-ports --output-id service-ports
          echo "::endgroup::"

  validate-docker-compose:
    name: 🐳 Validate Docker Compose
    runs-on: ubuntu-latest
    needs: get-affected
    if: needs.get-affected.outputs.affected-services != ''
    env:
     TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
     TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          fetch-depth: 0

      - name: 🚀 Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          no-cache: true
          bun-version: 1.4.0

      - name: 🗃️ Cache Bun dependencies
        uses: actions/cache@v5.1.0
        id: bun-cache
        with:
          path: |
            ~/.bun/install/cache
            **/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
  
      - name: 📦 Install dependencies
        if: steps.bun-cache.outputs.cache-hit != 'true'
        run: bun install

      - name: 🐳 Setup Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: 🏗️ Test Production Build
        run: |
          echo "::group::🏗️ Testing Production Build"

          if [ -z "${{ needs.get-affected.outputs.affected-services }}" ]; then
            echo "No affected services to test"
            exit 0
          fi

          # Build production images without cache to test build process
          bun run container --prod compose build ${{ needs.get-affected.outputs.affected-services }} --no-cache --parallel
          if [ $? -ne 0 ]; then
            echo "❌ Production builds failed"
            exit 1
          fi
          
          echo "✅ Production builds completed successfully"
          echo "::endgroup::"

      - name: 🧪 Test Production Services
        run: |
          echo "::group::🧪 Testing Production Services"

          if [ -z "${{ needs.get-affected.outputs.affected-services }}" ]; then
            echo "No affected packages to test"
            exit 0
          fi

          if ! bun run container --prod compose up ${{ needs.get-affected.outputs.affected-services }} -d; then
            echo "❌ Production compose up failed"
            bun run container --prod compose logs --no-color ${{ needs.get-affected.outputs.affected-services }} || true
            exit 1
          fi

          sleep 90

          bun run container --prod compose ps

          HTTP_SERVICES="web auth nestjs ui"

          for service in ${{ needs.get-affected.outputs.affected-services }}; do
            case " $HTTP_SERVICES " in
              *" $service "*) ;;
              *)
                echo "Skipping $service (not an HTTP /status probe target)"
                continue
                ;;
            esac

            port=$(echo '${{ needs.get-affected.outputs.service-ports }}' | jq -r --arg service "$service" '.[$service] // empty')
            if [ -z "$port" ] || [ "$port" = "null" ]; then
              echo "❌ Service $service is missing a published port in service-ports"
              exit 1
            fi

            echo "Probing $service on port $port"
            probe_path="/status"
            if [ "$service" = "web" ]; then
              probe_path="/"
            fi
            healthy=0
            for attempt in 1 2 3; do
              if curl -sf -H 'Accept: application/json' --max-time 5 "http://localhost:${port}${probe_path}" | grep -Eq '"ok"[[:space:]]*:[[:space:]]*true'; then
                echo "✅ $service is healthy (attempt ${attempt})"
                healthy=1
                break
              fi
              echo "Attempt ${attempt} failed for $service"
              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done

            if [ "$healthy" -ne 1 ]; then
              echo "❌ $service did not become healthy after 3 attempts"
              bun run container --prod compose logs --no-color "$service" || true
              exit 1
            fi
          done

      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "::group::🧹 Cleaning up Docker resources"
          if [ -z "${{ needs.get-affected.outputs.affected-services }}" ]; then
            echo "No affected services to clean up"
            exit 0
          fi

          bun run container --prod compose down ${{ needs.get-affected.outputs.affected-services }} --remove-orphans || true
          docker system prune -f || true
          echo "✅ Cleanup completed"
          echo "::endgroup::"
