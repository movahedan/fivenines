name: fivenines-dev

networks:
  dev-network:
    driver: bridge

volumes:
  node_modules:
    driver: local
  turbo_cache:
    driver: local
  bun_cache:
    driver: local
  vscode_cache:
    driver: local
  postgres_data:
    driver: local

x-fivenines-extra-hosts: &fivenines-test-hosts
  - "host.docker.internal:host-gateway"
  - "play.fivenines.com:host-gateway"
  - "auth.fivenines.com:host-gateway"
  - "api.fivenines.com:host-gateway"

services:
  # Apps runtime environment - shared container for all applications
  apps:
    build:
      context: ./
      dockerfile: Dockerfile.dev
      x-bake:
        contexts:
          buildkit: docker-container://buildkit
      cache_from:
        - type=gha
      shm_size: '1gb'
    volumes:
      - ${PROJECT_ROOT:-./}/apps:/app/apps:cached
      - ${PROJECT_ROOT:-./}/packages:/app/packages:cached
      - ${PROJECT_ROOT:-./}/tools:/app/tools:cached
      - ${PROJECT_ROOT:-./}/package.json:/app/package.json:cached
      - ${PROJECT_ROOT:-./}/bun.lock:/app/bun.lock:cached
      - ${PROJECT_ROOT:-./}/turbo.json:/app/turbo.json:cached
      - ${PROJECT_ROOT:-./}/intershell.config.ts:/app/intershell.config.ts:cached
      - node_modules:/app/node_modules:delegated
      - turbo_cache:/app/.turbo:delegated
      - bun_cache:/root/.bun:delegated
      - vscode_cache:/app/.vscode:delegated
    command: sleep infinity
    init: true
    profiles: ["apps"]
    environment:
      # Bind mounts from macOS often miss inotify; polling makes Vite/Storybook HMR work in containers.
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    networks:
      - dev-network
    healthcheck:
      test: ["CMD", "ps", "aux"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    profiles: ["nestjs", "auth", "web", "all"]
    networks:
      - dev-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fivenines}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fivenines}
      POSTGRES_DB: ${POSTGRES_DB:-fivenines}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fivenines} -d ${POSTGRES_DB:-fivenines}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nestjs:
    x-fivenines-package: "@apps/nestjs"
    extends:
      service: apps
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${NESTJS_PORT:-3002}"
    ports:
      - "${NESTJS_PORT:-3002}:${NESTJS_PORT:-3002}"
    extra_hosts: *fivenines-test-hosts
    environment:
      HOST: "0.0.0.0"
      PORT: "${NESTJS_PORT:-3002}"
      NESTJS_PORT: "${NESTJS_PORT:-3002}"
      NODE_ENV: development
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://play.fivenines.com:3000,http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-fivenines}:${POSTGRES_PASSWORD:-fivenines}@postgres:5432/${POSTGRES_DB:-fivenines}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://auth.fivenines.com:3001/.well-known/jwks.json}
      AUTH_ISSUER: ${AUTH_ISSUER:-http://auth.fivenines.com:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-fivenines-api}
      AUTH_ALLOW_HEADER_TENANT: ${AUTH_ALLOW_HEADER_TENANT:-false}
      AUTH_COOKIE_ACCESS: ${AUTH_COOKIE_ACCESS:-auth_access}
    command: >
      sh -c "cd apps/nestjs && bun run db:generate && bun run db:migrate:deploy && bun run db:seed &&
      cd ../.. && bun run turbo run dev --filter=@apps/nestjs"
    profiles: ["nestjs", "web", "all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Accept: application/json' http://127.0.0.1:${NESTJS_PORT:-3002}/status | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s

  ui:
    x-fivenines-package: "@packages/ui"
    extends:
      service: apps
    expose:
      - "${UI_PORT:-9000}"
    ports:
      - "${UI_PORT:-9000}:${UI_PORT:-9000}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${UI_PORT:-9000}"
      UI_PORT: "${UI_PORT:-9000}"
    command: bun run turbo run dev --filter=@packages/ui
    profiles: ["ui", "all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Accept: application/json' http://127.0.0.1:${UI_PORT:-9000}/status | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  web:
    x-fivenines-package: "@apps/web"
    extends:
      service: apps
    depends_on:
      nestjs:
        condition: service_healthy
    expose:
      - "${WEB_PORT:-3000}"
    ports:
      - "${WEB_PORT:-3000}:${WEB_PORT:-3000}"
    extra_hosts: *fivenines-test-hosts
    environment:
      HOST: "0.0.0.0"
      PORT: "${WEB_PORT:-3000}"
      WEB_PORT: "${WEB_PORT:-3000}"
      NESTJS_API_URL: ${VITE_NESTJS_API_URL:-http://api.fivenines.com:3002}
      VITE_NESTJS_API_URL: ${VITE_NESTJS_API_URL:-http://api.fivenines.com:3002}
      VITE_AUTH_URL: ${VITE_AUTH_URL:-http://auth.fivenines.com:3001}
      VITE_APP_ORIGIN: ${VITE_APP_ORIGIN:-http://play.fivenines.com:3000}
    command: bun run turbo run dev --filter=@apps/web
    profiles: ["web", "all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Accept: application/json' http://127.0.0.1:${WEB_PORT:-3000}/status | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  auth:
    x-fivenines-package: "@apps/auth"
    extends:
      service: apps
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "${AUTH_PORT:-3001}"
    ports:
      - "${AUTH_PORT:-3001}:${AUTH_PORT:-3001}"
    extra_hosts: *fivenines-test-hosts
    environment:
      HOST: "0.0.0.0"
      PORT: "${AUTH_PORT:-3001}"
      AUTH_PORT: "${AUTH_PORT:-3001}"
      NODE_ENV: development
      AUTH_ISSUER: ${AUTH_ISSUER:-http://auth.fivenines.com:3001}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-fivenines-api}
      AUTH_AUDIENCE_EVAL: ${AUTH_AUDIENCE_EVAL:-fivenines-eval}
      AUTH_DATABASE_URL: postgresql://${POSTGRES_USER:-fivenines}:${POSTGRES_PASSWORD:-fivenines}@postgres:5432/fivenines_auth
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-.fivenines.com}
      AUTH_COOKIE_ACCESS: ${AUTH_COOKIE_ACCESS:-auth_access}
      AUTH_COOKIE_LOGGED_IN: ${AUTH_COOKIE_LOGGED_IN:-was_logged_in}
      AUTH_SEED_ADMIN_EMAIL: ${AUTH_SEED_ADMIN_EMAIL:-admin@example.com}
      AUTH_SEED_ADMIN_PASSWORD: ${AUTH_SEED_ADMIN_PASSWORD:-changeme}
      AUTH_REDIRECT_ORIGINS: ${AUTH_REDIRECT_ORIGINS:-http://play.fivenines.com:3000,http://localhost:3000,http://127.0.0.1:3000}
    command: >
      sh -c "cd apps/auth && bun run db:generate && bun run db:migrate && bun run db:seed &&
      cd ../.. && bun run turbo run dev --filter=@apps/auth"
    profiles: ["auth", "all"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf -H 'Accept: application/json' http://127.0.0.1:${AUTH_PORT:-3001}/status | grep -Eq '\"ok\"[[:space:]]*:[[:space:]]*true'",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
